repo:
  name: mach-mono
  primary_branch: main
  description: Monorepo for focused Apple platform quality-of-life utilities.
  identity:
    suite_name: mach-mono
    naming_note: Prefer mach-mono and machNotch naming; keep boring.notch/BoringNotch only for attribution, license, and dependency history.

workspace:
  tech_stack:
    minimum_os: macOS 26
    minimum_ios: iOS 20
    swift_version: 6.3
    persistence: SwiftData
    widgets: WidgetKit
  xcode:
    path: mach-mono.xcworkspace
    primary_scheme: machNotch
    primary_project: Apps/machNotch/machNotch.xcodeproj
    # All members of the workspace (see mach-mono.xcworkspace/contents.xcworkspacedata)
    # read-only: IDE navigation only — never run builds from Xcode. Use Bazel.
    includes:
      - Apps/machNotch/machNotch.xcodeproj
      - Apps/machBrief/machBrief.xcodeproj
      - Packages/MacroVisionKit
      - Packages/MachBriefKit
      - Packages/MachIntelligenceKit
      - Packages/MachSoundKit
      - Packages/NotchCore
      - Packages/NotchServices
      - Packages/NotchUI
      - Packages/NotchPlugins
      - Packages/NotchSettingsMacro
  bazel:
    status: active
    module: MODULE.bazel
    roadmap: Roadmap.md

products:
  machNotch:
    display_name: mach.notch
    kind: macOS app
    status: active
    path: Apps/machNotch
    xcode_project: Apps/machNotch/machNotch.xcodeproj
    scheme: machNotch
    agent_instructions: Apps/machNotch/CLAUDE.md
    architecture: Architecture.md
    license:
      current: GPL-3.0
      target: MIT

  machBrief:
    display_name: mach.brief
    kind: macOS/iOS app
    status: in_development
    path: Apps/machBrief
    xcode_project: Apps/machBrief/machBrief.xcodeproj
    package: Packages/MachBriefKit
    bazel:
      build: bazel build //Apps/machBrief:machBrief
      test: bazel test //Packages/MachBriefKit:MachBriefKitTests
    license:
      target: MIT

packages:
  root: Packages
  existing:
    MachBriefKit:
      path: Packages/MachBriefKit
      license: MIT
    MachIntelligenceKit:
      path: Packages/MachIntelligenceKit
      license: MIT
    MachSoundKit:
      path: Packages/MachSoundKit
      license: MIT
    HealthExportKit:
      path: Packages/HealthExportKit
      license: MIT
    MacroVisionKit:
      path: Packages/MacroVisionKit
      license: MIT
    NotchCore:
      path: Packages/NotchCore
      license: MIT
    NotchServices:
      path: Packages/NotchServices
      license: MIT
    NotchUI:
      path: Packages/NotchUI
      license: MIT
    NotchPlugins:
      path: Packages/NotchPlugins
      license: MIT
    NotchSettingsMacro:
      path: Packages/NotchSettingsMacro
      license: MIT
  planned: []

policies:
  naming:
    project_identity: mach-mono / machNotch
    avoid_stale_names:
      - boring
      - boring.notch
    exceptions:
      - attribution
      - license history
      - dependency history
  branching:
    model: main-only
  build_verification:
    preferred_entrypoint: bazel
    command: bazel build //Apps/machBrief:machBrief
    test_command: bazel test //Packages/MachBriefKit:MachBriefKitTests
  licensing:
    new_apps: MIT
    new_packages: MIT
    forbidden_dependency_licenses:
      - GPL
      - MPL
  architecture:
    plugin_first: true
    dependency_injection_root: AppObjectGraph
    new_singletons_allowed: false
    max_swift_file_lines: 300

services:
  weather:
    primary: OpenWeatherMap
    fallback: WeatherKit
    cache_duration_minutes: 30

docs:
  index: Architecture.md
  overall_model_description: Architecture.md
  architecture: Architecture.md
  plugin_system: Architecture.md
  roadmaps: Roadmap.md
  planning: https://github.com/larsboes/mach-mono/issues
  contributing: CONTRIBUTING.md
  security: SECURITY.md

agent_files:
  canonical_guidelines: AGENTS.md
  claude_code_config: .claude
  reusable_skills: .agents/skills
