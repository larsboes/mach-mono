repo:
  name: mach-mono
  primary_branch: main
  description: Monorepo for focused Apple platform quality-of-life utilities.
  identity:
    suite_name: mach-mono
    naming_note: Prefer mach-mono and machNotch naming; keep boring.notch/BoringNotch only for attribution, license, and dependency history.

workspace:
  tech_stack:
    minimum_os: macOS 26
    minimum_ios: iOS 20
    swift_version: 6.3
    persistence: SwiftData
    widgets: WidgetKit
  xcode:
    path: mach-mono.xcworkspace
    primary_scheme: machNotch
    primary_project: Apps/machNotch/machNotch.xcodeproj
    # Generated by Tuist from the Project.swift manifests and gitignored.
    # Run `task gen` to produce them. Building from Xcode is supported and
    # expected; the manifests are the source of truth, not the .pbxproj.
    includes:
      - Apps/machNotch/machNotch.xcodeproj
      - Apps/machBrief/machBrief.xcodeproj
      - Packages/MacroVisionKit
      - Packages/MachBriefKit
      - Packages/MachIntelligenceKit
      - Packages/MachSoundKit
      - Packages/NotchCore
      - Packages/NotchServices
      - Packages/NotchUI
      - Packages/NotchPlugins
      - Packages/NotchSettingsMacro
  tuist:
    status: active
    version: "4.205.0"
    config: Tuist.swift
    external_dependencies: Tuist/Package.swift
    helpers: Tuist/ProjectDescriptionHelpers/Mach.swift
    workspace_manifest: Workspace.swift
    generate: task gen

products:
  machNotch:
    display_name: mach.notch
    kind: macOS app
    status: active
    path: Apps/machNotch
    xcode_project: Apps/machNotch/machNotch.xcodeproj
    scheme: machNotch
    agent_instructions: Apps/machNotch/CLAUDE.md
    architecture: Architecture.md
    license:
      current: GPL-3.0
      target: MIT

  machBrief:
    display_name: mach.brief
    kind: macOS/iOS app
    status: in_development
    path: Apps/machBrief
    xcode_project: Apps/machBrief/machBrief.xcodeproj
    package: Packages/MachBriefKit
    commands:
      build: task brief:build
      test: task brief:test
    license:
      target: MIT

  machHealth:
    display_name: mach.health
    kind: iOS app
    status: stub
    path: Apps/machHealth
    # Standalone SwiftPM package, not a Tuist project. Excluded from
    # Workspace.swift on purpose; see the comment at the top of that file.
    swift_package: Apps/machHealth/Package.swift
    package: Packages/HealthExportKit
    commands:
      test: task health:test
    license:
      target: MIT

packages:
  root: Packages
  existing:
    MachBriefKit:
      path: Packages/MachBriefKit
      license: MIT
    MachIntelligenceKit:
      path: Packages/MachIntelligenceKit
      license: MIT
    MachSoundKit:
      path: Packages/MachSoundKit
      license: MIT
    HealthExportKit:
      path: Packages/HealthExportKit
      license: MIT
    MacroVisionKit:
      path: Packages/MacroVisionKit
      license: MIT
    NotchCore:
      path: Packages/NotchCore
      license: MIT
    NotchServices:
      path: Packages/NotchServices
      license: MIT
    NotchUI:
      path: Packages/NotchUI
      license: MIT
    NotchPlugins:
      path: Packages/NotchPlugins
      license: MIT
    NotchSettingsMacro:
      path: Packages/NotchSettingsMacro
      license: MIT
  planned: []

policies:
  naming:
    project_identity: mach-mono / machNotch
    avoid_stale_names:
      - boring
      - boring.notch
    exceptions:
      - attribution
      - license history
      - dependency history
  branching:
    model: main-only
  build_verification:
    preferred_entrypoint: task
    command: task brief:build
    test_command: task brief:test
  licensing:
    new_apps: MIT
    new_packages: MIT
    forbidden_dependency_licenses:
      - GPL
      - MPL
  architecture:
    plugin_first: true
    dependency_injection_root: AppObjectGraph
    new_singletons_allowed: false
    max_swift_file_lines: 300

services:
  weather:
    primary: OpenWeatherMap
    fallback: WeatherKit
    cache_duration_minutes: 30

docs:
  index: Architecture.md
  overall_model_description: Architecture.md
  architecture: Architecture.md
  plugin_system: Architecture.md
  roadmaps: Roadmap.md
  planning: https://github.com/larsboes/mach-mono/issues
  contributing: CONTRIBUTING.md
  security: SECURITY.md

agent_files:
  canonical_guidelines: AGENTS.md
  claude_code_config: .claude
  reusable_skills: .agents/skills
