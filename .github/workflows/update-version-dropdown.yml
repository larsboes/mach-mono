name: Update Version Dropdown in Issue Form
# Least-privilege: only needs to push the updated issue template file.
permissions:
  contents: write
on:
  workflow_dispatch: {}
jobs:
  update-dropdown:
    runs-on: ubuntu-latest
    env:
      ISSUE_FORM_PATH: .github/ISSUE_TEMPLATE/1-bug-report-form.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch tags
        run: git fetch --tags

      - name: Update version dropdown
        run: |
          ruby <<'RUBY'
          require "yaml"

          issue_form = ENV.fetch("ISSUE_FORM_PATH")
          tags = `git tag --sort=-v:refname`
            .lines
            .map(&:strip)
            .grep(/\Av\d+\.\d+\.\d+(?:[-+].*)?\z/)
            .first(5)

          form = YAML.load_file(issue_form)
          version_dropdown = form.fetch("body").find do |item|
            item["type"] == "dropdown" && item["id"] == "version"
          end
          raise "version dropdown not found in #{issue_form}" unless version_dropdown

          version_dropdown.fetch("attributes")["options"] = ["Select a version"] + tags
          File.write(issue_form, YAML.dump(form, line_width: -1))
          RUBY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add "${ISSUE_FORM_PATH}"
            git commit -m "Update issue form version dropdown"
            git push
          fi
