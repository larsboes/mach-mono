name: "Deploy machNotch"
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: machNotch
  APP_DIR: Apps/machNotch
  APPCAST_PATH: Apps/machNotch/updater/appcast.xml
  BETA_CHANNEL_NAME: beta
  CODE_SIGN_IDENTITY: "Apple Development"
  XCODE_VERSION: "16.4"

permissions:
  contents: write

jobs:
  preparation:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.extract_version.outputs.is_beta }}
      version: ${{ steps.extract_version.outputs.version }}
      build_number: ${{ steps.extract_version.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"beta"* || "$VERSION" == *"rc"* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    needs: preparation
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref_name }}
      version: ${{ needs.preparation.outputs.version }}
      build_number: ${{ needs.preparation.outputs.build_number }}
      xcode_version: "16.4"
      code_sign_identity: "Apple Development"
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD:              ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD:         ${{ secrets.KEYCHAIN_PASSWORD }}

  publish:
    name: Publish release
    needs: [preparation, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_BETA: ${{ needs.preparation.outputs.is_beta }}
        run: |
          set -euo pipefail
          test -x "${APP_DIR}/Configuration/sparkle/generate_appcast" || {
            echo "::error::${APP_DIR}/Configuration/sparkle/generate_appcast missing or not executable"; exit 1;
          }
          CHANNEL_ARGS=()
          if [[ "${IS_BETA}" == "true" ]]; then
            CHANNEL_ARGS=(--channel "${{ env.BETA_CHANNEL_NAME }}")
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "${APP_DIR}/Configuration/sparkle/generate_appcast" \
            --ed-key-file - \
            --link "https://github.com/larsboes/mach-mono/releases" \
            --download-url-prefix "https://github.com/larsboes/mach-mono/releases/download/v${VERSION}/" \
            "${CHANNEL_ARGS[@]}" \
            -o "${APPCAST_PATH}" \
            Release/

      - name: Commit appcast
        id: commit_appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Since we are on a tag, we need to push the appcast to the main branch
          git fetch origin main
          git checkout main
          cp "${APPCAST_PATH}" "$RUNNER_TEMP/appcast.xml"
          cp "$RUNNER_TEMP/appcast.xml" "${APPCAST_PATH}"
          git add "${APPCAST_PATH}"
          git commit -m "Update appcast for v${{ needs.preparation.outputs.version }}" || echo "appcast already up to date"
          git push origin main
          
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_BETA: ${{ needs.preparation.outputs.is_beta }}
          RELEASE_SHA: ${{ steps.commit_appcast.outputs.release_sha }}
        run: |
          RELEASE_FLAGS=(--generate-notes)
          if [[ "${IS_BETA}" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "v${VERSION}" Release/machNotch.dmg \
            --title "v${VERSION}" \
            --target "${RELEASE_SHA}" \
            "${RELEASE_FLAGS[@]}"

  upgrade-brew:
    name: Update Homebrew cask
    needs: [preparation, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
      IS_BETA: ${{ needs.preparation.outputs.is_beta }}
    steps:
      - name: Generate cask files
        run: |
          set -euo pipefail
          DMG_URL="https://github.com/larsboes/mach-mono/releases/download/v${VERSION}/machNotch.dmg"

          for attempt in 1 2 3; do
            if SHA256=$(curl -sL --fail "$DMG_URL" | shasum -a 256 | cut -d' ' -f1); then break; fi
            echo "Attempt $attempt failed, retrying in 10s..."; sleep 10
          done
          [[ -n "${SHA256:-}" ]] || { echo "::error::Failed to download DMG for SHA256"; exit 1; }

          write_cask() {
            local CASK_NAME="$1" DISPLAY_NAME="$2" DESC="$3"
            cat <<CASK
          cask "${CASK_NAME}" do
            version "${VERSION}"
            sha256 "${SHA256}"
            url "${DMG_URL}"
            name "${DISPLAY_NAME}"
            desc "${DESC}"
            homepage "https://github.com/larsboes/mach-mono"
            livecheck do
              url :url
              strategy :github_latest
            end
            auto_updates true
            depends_on macos: ">= :sonoma"
            app "machNotch.app"
            zap trash: [
              "~/Library/Application Scripts/com.larsboes.machnotch/",
              "~/Library/Containers/com.larsboes.machnotch/",
            ]
          end
          CASK
          }

          write_cask "mach-notch@rc" "machNotch RC" \
            "Native macOS notch utility (Release Candidate)" > mach-notch@rc.rb
          if [[ "${IS_BETA}" == "false" ]]; then
            write_cask "mach-notch" "machNotch" \
              "Native macOS notch utility" > mach-notch.rb
          fi

      - name: Upload cask artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask-${{ env.VERSION }}
          path: mach-notch*.rb

      - uses: actions/checkout@v6
        with:
          repository: larsboes/mach-mono
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update casks in tap
        run: |
          set -euo pipefail
          cp mach-notch@rc.rb homebrew-tap/Casks/mach-notch@rc.rb
          COMMIT_MSG="Update mach-notch@rc to v${VERSION}"
          if [[ "${IS_BETA}" == "false" ]]; then
            cp mach-notch.rb homebrew-tap/Casks/mach-notch.rb
            COMMIT_MSG="Update mach-notch and mach-notch@rc to v${VERSION}"
          fi
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            git push
          fi
