name: "Deploy machNotch"
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: machNotch
  APP_DIR: Apps/machNotch
  APPCAST_PATH: Apps/machNotch/updater/appcast.xml
  BETA_CHANNEL_NAME: beta
  CODE_SIGN_IDENTITY: "-"

permissions:
  contents: write

jobs:
  preparation:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.extract_version.outputs.is_beta }}
      version: ${{ steps.extract_version.outputs.version }}
      build_number: ${{ steps.extract_version.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"beta"* || "$VERSION" == *"rc"* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    needs: preparation
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref_name }}
      version: ${{ needs.preparation.outputs.version }}
      build_number: ${{ needs.preparation.outputs.build_number }}
      code_sign_identity: "-"
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD:              ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD:         ${{ secrets.KEYCHAIN_PASSWORD }}

  publish:
    name: Publish release
    needs: [preparation, build]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release

      - name: Generate signed appcast
        id: generate_appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_BETA: ${{ needs.preparation.outputs.is_beta }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "::warning title=Missing Sparkle key::PRIVATE_SPARKLE_KEY is not set; skipping appcast generation for this release."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -x "${APP_DIR}/Configuration/sparkle/generate_appcast" || {
            echo "::error::${APP_DIR}/Configuration/sparkle/generate_appcast missing or not executable"; exit 1;
          }
          CHANNEL_ARGS=()
          if [[ "${IS_BETA}" == "true" ]]; then
            CHANNEL_ARGS=(--channel "${{ env.BETA_CHANNEL_NAME }}")
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "${APP_DIR}/Configuration/sparkle/generate_appcast" \
            --ed-key-file - \
            --link "https://github.com/larsboes/mach-mono/releases" \
            --download-url-prefix "https://github.com/larsboes/mach-mono/releases/download/v${VERSION}/" \
            "${CHANNEL_ARGS[@]}" \
            -o "${APPCAST_PATH}" \
            Release/
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Commit appcast
        id: commit_appcast
        if: ${{ steps.generate_appcast.outputs.generated == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp "${APPCAST_PATH}" "$RUNNER_TEMP/appcast.xml"
          
          # Since we are on a tag, we need to push the appcast to the main branch
          git fetch origin main
          git checkout main
          git pull --rebase origin main
          cp "$RUNNER_TEMP/appcast.xml" "${APPCAST_PATH}"
          git add "${APPCAST_PATH}"
          git commit -m "Update appcast for v${{ needs.preparation.outputs.version }}" || echo "appcast already up to date"
          git push origin main
          
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_BETA: ${{ needs.preparation.outputs.is_beta }}
          RELEASE_SHA: ${{ steps.commit_appcast.outputs.release_sha || github.sha }}
        run: |
          RELEASE_FLAGS=(--generate-notes)
          if [[ "${IS_BETA}" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "v${VERSION}" Release/machNotch.dmg \
            --title "v${VERSION}" \
            --target "${RELEASE_SHA}" \
            "${RELEASE_FLAGS[@]}"
