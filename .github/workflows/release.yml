name: "Deploy machNotch"
on:
  push:
    tags:
      # Match semver tags only — vN.N.N with optional pre-release / build suffix.
      # Prevents accidental tags like `v-test` or `vbackup-2026` from triggering
      # a release build.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  # Tag refs are unique, so the practical effect of this group is "don't run
  # two workflows for the literal same tag at once". cancel-in-progress is
  # explicitly false: a release can write to appcast.xml on main, create a
  # GitHub Release, and upload a DMG. Cancelling mid-flight can leave any
  # subset of those done — much harder to recover from than a duplicate run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: machNotch
  APP_DIR: Apps/machNotch
  APPCAST_PATH: Apps/machNotch/updater/appcast.xml
  ISSUE_FORM_PATH: .github/ISSUE_TEMPLATE/1-bug-report-form.yml
  BETA_CHANNEL_NAME: beta
  CODE_SIGN_IDENTITY: "-"

permissions:
  contents: write

jobs:
  preparation:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.extract_version.outputs.is_beta }}
      version: ${{ steps.extract_version.outputs.version }}
      build_number: ${{ steps.extract_version.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"beta"* || "$VERSION" == *"rc"* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    needs: preparation
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref_name }}
      version: ${{ needs.preparation.outputs.version }}
      build_number: ${{ needs.preparation.outputs.build_number }}
      code_sign_identity: "-"
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD:              ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD:         ${{ secrets.KEYCHAIN_PASSWORD }}

  publish:
    name: Publish release
    needs: [preparation, build]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release

      - name: Generate signed appcast
        id: generate_appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_BETA: ${{ needs.preparation.outputs.is_beta }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "::warning title=Missing Sparkle key::PRIVATE_SPARKLE_KEY is not set; skipping appcast generation for this release."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -x "${APP_DIR}/Configuration/sparkle/generate_appcast" || {
            echo "::error::${APP_DIR}/Configuration/sparkle/generate_appcast missing or not executable"; exit 1;
          }
          CHANNEL_ARGS=()
          if [[ "${IS_BETA}" == "true" ]]; then
            CHANNEL_ARGS=(--channel "${{ env.BETA_CHANNEL_NAME }}")
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "${APP_DIR}/Configuration/sparkle/generate_appcast" \
            --ed-key-file - \
            --link "https://github.com/larsboes/mach-mono/releases" \
            --download-url-prefix "https://github.com/larsboes/mach-mono/releases/download/v${VERSION}/" \
            "${CHANNEL_ARGS[@]}" \
            -o "${APPCAST_PATH}" \
            Release/
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Commit release metadata
        id: commit_release_metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.generate_appcast.outputs.generated }}" == "true" ]]; then
            cp "${APPCAST_PATH}" "$RUNNER_TEMP/appcast.xml"
          fi

          # Since we are on a tag, release metadata needs to land on main.
          git fetch origin main --tags
          git checkout main
          git pull --rebase origin main

          if [[ "${{ steps.generate_appcast.outputs.generated }}" == "true" ]]; then
            cp "$RUNNER_TEMP/appcast.xml" "${APPCAST_PATH}"
          fi

          ruby <<'RUBY'
          require "yaml"

          issue_form = ENV.fetch("ISSUE_FORM_PATH")
          tags = `git tag --sort=-v:refname`
            .lines
            .map(&:strip)
            .grep(/\Av\d+\.\d+\.\d+(?:[-+].*)?\z/)
            .first(5)

          form = YAML.load_file(issue_form)
          version_dropdown = form.fetch("body").find do |item|
            item["type"] == "dropdown" && item["id"] == "version"
          end
          raise "version dropdown not found in #{issue_form}" unless version_dropdown

          version_dropdown.fetch("attributes")["options"] = ["Select a version"] + tags
          File.write(issue_form, YAML.dump(form, line_width: -1))
          RUBY

          git add "${APPCAST_PATH}" "${ISSUE_FORM_PATH}"
          if git diff --cached --quiet; then
            echo "Release metadata already up to date."
          else
            git commit -m "Update release metadata for v${{ needs.preparation.outputs.version }}"
            git push origin main
          fi

          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preparation.outputs.version }}
          IS_BETA: ${{ needs.preparation.outputs.is_beta }}
        run: |
          # No --target: gh defaults to the tag's commit, which is the SHA the
          # DMG was actually built from. Previously this used the post-appcast
          # main SHA, so the release "Source code" links pointed at a commit
          # that did NOT produce the attached binary.
          RELEASE_FLAGS=(--generate-notes)
          if [[ "${IS_BETA}" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "v${VERSION}" Release/machNotch.dmg \
            --title "v${VERSION}" \
            "${RELEASE_FLAGS[@]}"
