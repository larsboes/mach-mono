name: "Reusable Build"
on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: false
        type: string
      code_sign_identity:
        required: false
        type: string
        default: "-"
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      PROJECT_NAME: machNotch
      PROJECT_PATH: Apps/machNotch/machNotch.xcodeproj
      APP_DIR: Apps/machNotch
      EXPORT_METHOD: development
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM_ID }}
      CODE_SIGN_IDENTITY: ${{ inputs.code_sign_identity || '-' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_ref }}

      - name: Cache Bazel repositories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel', 'tools/defs.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Install Apple certificate
        if: ${{ env.CODE_SIGN_IDENTITY != '-' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"

      - name: Build and sign with Bazel
        run: |
          # Fall back to safe defaults so non-tag manual_build runs still parse the embed label.
          VERSION="${VERSION_INPUT:-0.0.0}"
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-${GITHUB_RUN_NUMBER:-0}}"
          bazelisk build --config=ci //Apps/machNotch:machNotch \
            --stamp \
            --embed_label="machNotch_${VERSION}_build_${BUILD_NUMBER}"

          APP_PATH="bazel-bin/Apps/machNotch/machNotch.app"
          codesign --deep --force --sign "$CODE_SIGN_IDENTITY" "$APP_PATH"

      - name: Verify generate_appcast exists
        run: |
          if [ ! -x "${{ env.APP_DIR }}/Configuration/sparkle/generate_appcast" ]; then
            echo "::warning title=Missing generate_appcast::${{ env.APP_DIR }}/Configuration/sparkle/generate_appcast is not present or not executable; skipping appcast generation verification."
          fi

      - name: Create DMG
        run: |
          mkdir -p Release
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          pip install --upgrade pip setuptools wheel "dmgbuild[badge_icons]"
          chmod +x "${{ env.APP_DIR }}/Configuration/dmg/create_dmg.sh"
          "${{ env.APP_DIR }}/Configuration/dmg/create_dmg.sh" \
            "bazel-bin/Apps/machNotch/machNotch.app" \
            "Release/${{ env.PROJECT_NAME }}.dmg" \
            "${{ env.PROJECT_NAME }} ${{ env.VERSION_INPUT }}"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release/${{ env.PROJECT_NAME }}.dmg

      - name: Upload .app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.app
          path: bazel-bin/Apps/machNotch/${{ env.PROJECT_NAME }}.app
