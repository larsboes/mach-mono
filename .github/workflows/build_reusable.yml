name: "Reusable Build"
on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: false
        type: string
      code_sign_identity:
        required: false
        type: string
        default: "-"
      upload_artifacts:
        description: "Upload .app and .dmg artifacts. Set to false for dry-run smoke tests on main."
        required: false
        type: boolean
        default: true
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: macos-26
    # No job-level permissions: the build doesn't need write access. The caller
    # workflow controls permissions (release.yml grants contents: write because
    # its publish job pushes the appcast; cicd.yml's dry-run stays read-only).
    env:
      PROJECT_NAME: machNotch
      APP_DIR: Apps/machNotch
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      CODE_SIGN_IDENTITY: ${{ inputs.code_sign_identity || '-' }}
      DD: .build/xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_ref }}

      - name: Install Tuist and uv
        run: brew install tuist uv

      # One cache instead of the three Bazel needed (bazelisk binary, repos,
      # outputs). Keyed on the manifest that pins the external packages.
      - name: Cache resolved packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Tuist/.build
            ~/.cache/swifterpm
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift') }}
          restore-keys: |
            tuist-spm-${{ runner.os }}-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Install Apple certificate
        if: ${{ env.CODE_SIGN_IDENTITY != '-' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"

      - name: Build and sign
        run: |
          # Safe defaults so non-tag manual_build runs still produce a version.
          VERSION="${VERSION_INPUT:-0.0.0}"
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-${GITHUB_RUN_NUMBER:-0}}"

          xcodebuild -workspace mach-mono.xcworkspace \
            -scheme machNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DD" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP_PATH="$DD/Build/Products/Release/machNotch.app"
          test -d "$APP_PATH" || { echo "::error::App bundle not found at $APP_PATH"; ls -R "$DD/Build/Products" || true; exit 1; }

          # Targets build unsigned (see Tuist/ProjectDescriptionHelpers/Mach.swift):
          # the app-groups entitlement makes Xcode demand a provisioning profile
          # otherwise. Sign the finished bundle here instead.
          codesign --deep --force --sign "$CODE_SIGN_IDENTITY" "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Assert the release app is Soundscape-free
        run: |
          # Replaces the Bazel graph query. Inspecting the shipped binary proves
          # the artifact, not the build graph.
          if otool -L "$APP_PATH/Contents/MacOS/machNotch" | grep -qi "AudioKit"; then
            echo "::error::release app links AudioKit"
            exit 1
          fi
          echo "✓ release app links no AudioKit"

      - name: Create DMG
        run: |
          mkdir -p Release
          VENV_DIR="$RUNNER_TEMP/venv"
          uv venv "$VENV_DIR"
          uv pip install --python "$VENV_DIR/bin/python" "dmgbuild[badge_icons]"
          export PATH="$VENV_DIR/bin:$PATH"
          chmod +x "${{ env.APP_DIR }}/Configuration/dmg/create_dmg.sh"
          "${{ env.APP_DIR }}/Configuration/dmg/create_dmg.sh" \
            "$APP_PATH" \
            "Release/${{ env.PROJECT_NAME }}.dmg" \
            "${{ env.PROJECT_NAME }} ${{ env.VERSION_INPUT }}"

      - name: Upload DMG
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release/${{ env.PROJECT_NAME }}.dmg

      - name: Upload .app
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.app
          path: .build/xcode/Build/Products/Release/${{ env.PROJECT_NAME }}.app
