name: "Reusable Build"
on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: false
        type: string
      code_sign_identity:
        required: false
        type: string
        default: "-"
      upload_artifacts:
        description: "Upload .app and .dmg artifacts. Set to false for dry-run smoke tests on main."
        required: false
        type: boolean
        default: true
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: macos-26
    # No job-level permissions: the build doesn't need write access. The caller
    # workflow controls permissions (release.yml grants contents: write because
    # its publish job pushes the appcast; cicd.yml's dry-run stays read-only).
    env:
      PROJECT_NAME: machNotch
      APP_DIR: Apps/machNotch
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      CODE_SIGN_IDENTITY: ${{ inputs.code_sign_identity || '-' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_ref }}

      - name: Cache Bazelisk binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/bazelisk
          key: bazelisk-${{ runner.os }}-${{ hashFiles('.bazelversion') }}

      - name: Cache Bazel repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel
          # Keep this key identical to cicd.yml so the cache is shared across
          # the CI build/test jobs and the release build. Diverging keys made
          # each pipeline re-download and re-link from scratch.
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel', 'Packages/MachBriefKit/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Install Apple certificate
        if: ${{ env.CODE_SIGN_IDENTITY != '-' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"

      - name: Build and sign with Bazel
        run: |
          # Fall back to safe defaults so non-tag manual_build runs still parse the embed label.
          VERSION="${VERSION_INPUT:-0.0.0}"
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-${GITHUB_RUN_NUMBER:-0}}"
          bazelisk build --config=ci //Apps/machNotch:machNotch \
            --stamp \
            --embed_label="machNotch_${VERSION}_build_${BUILD_NUMBER}"

          # rules_apple macos_application emits the bundle under <name>_archive-root/.
          # The top-level "machNotch.app" path used previously never existed and silently
          # broke every release (v1.2.0, v1.3.0, v1.3.1) at this codesign step.
          APP_PATH="bazel-bin/Apps/machNotch/machNotch_archive-root/machNotch.app"
          test -d "$APP_PATH" || { echo "::error::App bundle not found at $APP_PATH"; ls bazel-bin/Apps/machNotch/ || true; exit 1; }
          codesign --deep --force --sign "$CODE_SIGN_IDENTITY" "$APP_PATH"

      - name: Create DMG
        run: |
          mkdir -p Release
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          pip install --upgrade pip setuptools wheel "dmgbuild[badge_icons]"
          chmod +x "${{ env.APP_DIR }}/Configuration/dmg/create_dmg.sh"
          "${{ env.APP_DIR }}/Configuration/dmg/create_dmg.sh" \
            "bazel-bin/Apps/machNotch/machNotch_archive-root/machNotch.app" \
            "Release/${{ env.PROJECT_NAME }}.dmg" \
            "${{ env.PROJECT_NAME }} ${{ env.VERSION_INPUT }}"

      - name: Upload DMG
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release/${{ env.PROJECT_NAME }}.dmg

      - name: Upload .app
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.app
          path: bazel-bin/Apps/machNotch/machNotch_archive-root/${{ env.PROJECT_NAME }}.app
