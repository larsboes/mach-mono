name: CodeQL

# DISABLED — CodeQL Swift extraction is incompatible with this repo's build
# system (Bazel + rules_swift). Three approaches were tried; all failed:
#
#   1. bazelisk build with `--spawn_strategy=local`.
#      Worker theory: persistent workers spawn before CodeQL sets up its
#      tracing env (DYLD_INSERT_LIBRARIES + CODEQL_EXTRACTOR_SWIFT_*), so the
#      tracer never sees the swiftc invocations. Build succeeded, extractor
#      saw nothing.
#
#   2. bazelisk build with `--strategy=SwiftCompile=local` (mnemonic-specific
#      override) plus the other Swift mnemonics. Build stats confirmed zero
#      workers (`347 processes: 210 internal, 137 local`) — workers were
#      genuinely gone. Extractor STILL saw nothing.
#
#      Most likely real cause: macOS SIP strips DYLD_INSERT_LIBRARIES when a
#      protected binary in /usr/bin (xcrun is the most likely culprit) is
#      launched. By the time the actual swiftc child process spawns, the
#      tracer dylib is no longer injected.
#
#   3. Switch CodeQL to xcodebuild against Apps/machNotch/machNotch.xcodeproj.
#      Hits a Bazel/SPM duality: MachBriefKit ships a manual
#      Sources/MachBriefKit/Support/Bundle+Module.swift declaring
#      `Bundle.module` for Bazel builds; SPM auto-generates the same accessor
#      via resource_bundle_accessor.swift. xcodebuild fails with
#      "invalid redeclaration of 'module'" before CodeQL gets a chance to
#      trace anything.
#
# To re-enable, one of the following needs to happen:
#   - Resolve the Bundle.module duality (gate the manual declaration on
#     `#if !SWIFT_PACKAGE` or similar) so xcodebuild can compile the package,
#     then switch this workflow to the xcodebuild path.
#   - Wait for github/codeql-action to ship native Bazel support
#     (tracking github/codeql-action#2506).
#   - Move the security-scanning need to a different tool (Semgrep,
#     swift-security-checker, etc.) that doesn't require compile-time tracing.
#
# Until then, this workflow runs only on manual dispatch so the failing
# status doesn't pollute the main branch's check history.

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Swift) — DISABLED, manual dispatch only
    runs-on: macos-26
    steps:
      - name: Note
        run: |
          echo "::warning title=CodeQL Swift disabled::See codeql.yml header for why."
          echo "Triggered intentionally via workflow_dispatch."
          exit 1
