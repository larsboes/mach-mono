name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Bazel repositories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build all apps
        run: |
          bazelisk build --config=ci \
            //Apps/machNotch:machNotch \
            //Apps/machBrief:machBrief

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Bazel repositories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Packages/MachBriefKit/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run tests
        run: |
          bazelisk test --config=ci \
            //Packages/MachBriefKit:MachBriefKitTests \
            //Apps/machNotch:machNotchTests

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run architecture checks
        run: bash .github/scripts/arch-check.sh

  skills-check:
    name: Skills Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify skills are in sync
        run: |
          bash tools/sync-skills.sh
          if ! git diff --exit-code --quiet .gemini/skills/ .cursor/skills/; then
            echo ""
            echo "Skills are out of sync. Run 'task skills:sync' locally and commit the result."
            exit 1
          fi
          echo "All skill targets are in sync with .claude/skills/"
