name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Bazelisk binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/bazelisk
          key: bazelisk-${{ runner.os }}-${{ hashFiles('.bazelversion') }}

      - name: Cache Bazel repositories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel', 'Packages/MachBriefKit/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Regenerate Bazel lockfile
        if: github.actor == 'dependabot[bot]'
        run: bazelisk mod deps --lockfile_mode=update

      - name: Build all apps
        run: |
          bazelisk build --config=ci \
            //Apps/machNotch:machNotch \
            //Apps/machBrief:machBrief

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Bazelisk binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/bazelisk
          key: bazelisk-${{ runner.os }}-${{ hashFiles('.bazelversion') }}

      - name: Cache Bazel repositories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel', 'Packages/MachBriefKit/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Regenerate Bazel lockfile
        if: github.actor == 'dependabot[bot]'
        run: bazelisk mod deps --lockfile_mode=update

      - name: Run tests
        run: |
          bazelisk test --config=ci \
            //Packages/MachBriefKit:MachBriefKitTests \
            //Apps/machNotch:machNotchTests

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-test-results
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Bazelisk binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/Library/Caches/bazelisk
          key: bazelisk-${{ runner.os }}-${{ hashFiles('.bazelversion') }}

      - name: Cache Bazel repositories
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel', 'Packages/MachBriefKit/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Regenerate Bazel lockfile
        if: github.actor == 'dependabot[bot]'
        run: bazelisk mod deps --lockfile_mode=update

      - name: Generate coverage
        run: |
          bazelisk coverage --config=ci \
            --combined_report=lcov \
            --linkopt=-fprofile-instr-generate \
            //Packages/MachBriefKit:MachBriefKitTests \
            //Apps/machNotch:machNotchTests

      - name: Upload LCOV coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-lcov-coverage
          path: bazel-out/_coverage/_coverage_report.dat
          if-no-files-found: error

  swift-format:
    name: Swift Format Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install swift-format
        run: brew install swift-format
      # Strict mode: any style violation fails CI. The baseline was cleared
      # via `swift-format format -i` once .swift-format dropped the
      # AlwaysUseLowerCamelCase rule (it fired on legit C-API bindings and
      # SwiftUI-style helper-view functions).
      - name: Lint Swift formatting
        run: |
          swift-format lint --strict --recursive --parallel \
            Apps/machNotch/machNotch/ \
            Packages/MachBriefKit/Sources/ \
            Packages/MacroVisionKit/Sources/

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run architecture checks
        run: bash .github/scripts/arch-check.sh

  skills-check:
    name: Skills Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify skill adapters
        run: bash tools/sync-skills.sh --check

  # Release path smoke test: runs only on push to main so PRs stay fast.
  # Exercises the same Bazel build + codesign + DMG path as `release.yml` so
  # bugs in the release pipeline (like the codesign path bug that hid through
  # v1.2.0–v1.3.1) are caught within one commit instead of three releases.
  # Artifacts are uploaded so "try the latest main" works without local Bazel.
  release-dryrun:
    name: Release Dry-Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref_name }}
      code_sign_identity: "-"
      upload_artifacts: true
    secrets: inherit

  website:
    name: Website Audit & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit + Build
        uses: ./.github/actions/website-build
        with:
          audit: "true"
