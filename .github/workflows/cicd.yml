name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tuist
        run: brew install tuist

      # One cache, keyed on the manifest that pins the external packages.
      # Bazel needed three (bazelisk binary, repositories, outputs) plus a
      # lockfile-regeneration step, duplicated across every job.
      - name: Cache resolved packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Tuist/.build
            ~/.cache/swifterpm
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift') }}
          restore-keys: |
            tuist-spm-${{ runner.os }}-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Build all apps
        run: |
          for scheme in machNotch machNotchWithSoundscape machBrief; do
            xcodebuild -workspace mach-mono.xcworkspace -scheme "$scheme" \
              -configuration Debug -destination 'platform=macOS' \
              -derivedDataPath .build/xcode build
          done

      - name: Assert the default app is Soundscape-free
        run: |
          # Replaces `bazelisk query 'deps(...) intersect //Packages/MachSoundKit'`.
          # Inspecting the built binary proves the artifact, not the build graph.
          APP=.build/xcode/Build/Products/Debug/machNotch.app
          if otool -L "$APP/Contents/MacOS/machNotch" | grep -qi AudioKit; then
            echo "::error::default app links AudioKit"; exit 1
          fi
          echo "✓ default app links no AudioKit"

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tuist
        run: brew install tuist

      # One cache, keyed on the manifest that pins the external packages.
      # Bazel needed three (bazelisk binary, repositories, outputs) plus a
      # lockfile-regeneration step, duplicated across every job.
      - name: Cache resolved packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Tuist/.build
            ~/.cache/swifterpm
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift') }}
          restore-keys: |
            tuist-spm-${{ runner.os }}-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Run tests
        run: |
          xcodebuild -workspace mach-mono.xcworkspace \
            -scheme mach-mono-Workspace \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: warn

  coverage:
    name: Coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tuist
        run: brew install tuist

      # One cache, keyed on the manifest that pins the external packages.
      # Bazel needed three (bazelisk binary, repositories, outputs) plus a
      # lockfile-regeneration step, duplicated across every job.
      - name: Cache resolved packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Tuist/.build
            ~/.cache/swifterpm
          key: tuist-spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift') }}
          restore-keys: |
            tuist-spm-${{ runner.os }}-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Generate coverage
        run: |
          xcodebuild -workspace mach-mono.xcworkspace \
            -scheme mach-mono-Workspace \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            -resultBundlePath Coverage.xcresult \
            -enableCodeCoverage YES \
            test

      - name: Upload coverage bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-coverage
          path: Coverage.xcresult
          if-no-files-found: error

  swift-format:
    name: Swift Format Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install swift-format
        run: brew install swift-format
      # Strict mode: any style violation fails CI. The baseline was cleared
      # via `swift-format format -i` once .swift-format dropped the
      # AlwaysUseLowerCamelCase rule (it fired on legit C-API bindings and
      # SwiftUI-style helper-view functions).
      - name: Lint Swift formatting
        run: |
          swift-format lint --strict --recursive --parallel \
            Apps/machNotch/machNotch/ \
            Packages/MachBriefKit/Sources/ \
            Packages/MacroVisionKit/Sources/

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run architecture checks
        run: bash .github/scripts/arch-check.sh

  skills-check:
    name: Skills Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify skill adapters
        run: bash resources/tools/sync-skills.sh --check

  # Release path smoke test: runs only on push to main so PRs stay fast.
  # Exercises the same Bazel build + codesign + DMG path as `release.yml` so
  # bugs in the release pipeline (like the codesign path bug that hid through
  # v1.2.0–v1.3.1) are caught within one commit instead of three releases.
  # Artifacts are uploaded so "try the latest main" works without local Bazel.
  release-dryrun:
    name: Release Dry-Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref_name }}
      code_sign_identity: "-"
      upload_artifacts: true
    secrets: inherit

  website:
    name: Website Audit & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit + Build
        uses: ./.github/actions/website-build
        with:
          audit: "true"
