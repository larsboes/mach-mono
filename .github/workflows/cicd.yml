name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Cache Bazel repositories
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Apps/machBrief/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build all apps
        run: |
          bazelisk build --config=ci \
            //Apps/machNotch:machNotch \
            //Apps/machBrief:machBrief

  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Cache Bazel repositories
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repos
          key: bazel-repos-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved') }}
          restore-keys: |
            bazel-repos-${{ runner.os }}-

      - name: Cache Bazel outputs
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Package.resolved', '.bazelrc', 'Apps/machNotch/BUILD.bazel', 'Packages/MachBriefKit/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Run tests
        run: |
          bazelisk test --config=ci \
            //Packages/MachBriefKit:MachBriefKitTests \
            //Apps/machNotch:machNotchTests

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run architecture checks
        run: bash .github/scripts/arch-check.sh
