name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v5
    - name: Build machNotch
      run: |
        xcodebuild -workspace mach-mono.xcworkspace \
          -scheme machNotch \
          -destination 'platform=macOS' \
          -configuration Release \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          DEVELOPMENT_TEAM= \
          build

  test:
    name: Test
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Test machNotch
      run: |
        xcodebuild -workspace mach-mono.xcworkspace \
          -scheme machNotch \
          -destination 'platform=macOS' \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          DEVELOPMENT_TEAM= \
          test

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Run architecture checks
      run: bash .github/scripts/arch-check.sh
