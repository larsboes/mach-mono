name: Dependency Security

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  sbom-export:
    name: SBOM Export
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Export dependency graph SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > dependency-graph-sbom.spdx.json
          jq -e '.sbom.SPDXID' dependency-graph-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graph-sbom
          path: dependency-graph-sbom.spdx.json
          if-no-files-found: error
