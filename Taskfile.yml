version: "3"

# Build system: Tuist. `Project.swift` manifests are the source of truth; the
# .xcodeproj and .xcworkspace are generated and gitignored. Run `task gen` after
# adding or removing a file, then build.

vars:
  CERT: "Apple Development: ilars.boes@gmail.com (SVHPB8QYPH)"

  # One predictable output root instead of hunting through ~/Library/DerivedData.
  DD: ".build/xcode"
  PRODUCTS: ".build/xcode/Build/Products"
  WORKSPACE: "mach-mono.xcworkspace"
  DEST: "platform=macOS"

  # Override on the command line, e.g. `task build CONFIG=Release`.
  CONFIG: Debug
  VERSION: "0.0.0"
  BUILD: "0"

  NOTCH_DEST: "{{.HOME}}/Applications/machNotch.app"
  NOTCH_SOUNDSCAPE_DEST: "{{.HOME}}/Applications/machNotchWithSoundscape.app"
  BRIEF_DEST: "{{.HOME}}/Applications/machBrief.app"

tasks:
  default:
    cmds: [task --list]

  # ── project generation ────────────────────────────────────────────────────

  gen:
    desc: "Generate the Xcode workspace from the Project.swift manifests"
    cmds:
      - tuist install
      - tuist generate --no-open

  edit:
    desc: "Open the workspace in Xcode"
    deps: [gen]
    cmds:
      - open "{{.WORKSPACE}}"

  clean:
    desc: "Delete generated projects and build output"
    cmds:
      - tuist clean
      - rm -rf "{{.DD}}"
      - find . -name "*.xcodeproj" -not -path "./.build/*" -prune -exec rm -rf {} +
      - rm -rf "{{.WORKSPACE}}" Apps/*/Derived Packages/*/Derived

  # ── mach.notch ────────────────────────────────────────────────────────────

  build:
    desc: "notch: build the default (Soundscape-free) app"
    cmds:
      - >-
        xcodebuild -workspace "{{.WORKSPACE}}" -scheme machNotch
        -configuration {{.CONFIG}}
        -destination '{{.DEST}}' -derivedDataPath "{{.DD}}" build

  build:soundscape:
    desc: "notch: build the Soundscape-enabled app"
    cmds:
      - >-
        xcodebuild -workspace "{{.WORKSPACE}}" -scheme machNotchWithSoundscape
        -configuration {{.CONFIG}}
        -destination '{{.DEST}}' -derivedDataPath "{{.DD}}" build

  install:
    desc: "notch: build, sign and install the default app to ~/Applications"
    deps: [build]
    cmds:
      - task: kill
      - mkdir -p "{{.HOME}}/Applications"
      - rm -rf "{{.NOTCH_DEST}}"
      - cp -R "{{.PRODUCTS}}/{{.CONFIG}}/machNotch.app" "{{.NOTCH_DEST}}"
      # Built unsigned on purpose (see Tuist/ProjectDescriptionHelpers/Mach.swift);
      # sign here so TCC grants stick to a stable identity.
      - codesign --force --deep --sign "{{.CERT}}" "{{.NOTCH_DEST}}"
      - echo "✓ Installed and signed at {{.NOTCH_DEST}}"

  install:soundscape:
    desc: "notch: build, sign and install the Soundscape app to ~/Applications"
    deps: [build:soundscape]
    cmds:
      - task: kill:soundscape
      - mkdir -p "{{.HOME}}/Applications"
      - rm -rf "{{.NOTCH_SOUNDSCAPE_DEST}}"
      - cp -R "{{.PRODUCTS}}/{{.CONFIG}}/machNotchWithSoundscape.app" "{{.NOTCH_SOUNDSCAPE_DEST}}"
      - codesign --force --deep --sign "{{.CERT}}" "{{.NOTCH_SOUNDSCAPE_DEST}}"
      - echo "✓ Installed and signed at {{.NOTCH_SOUNDSCAPE_DEST}}"

  run:
    desc: "notch: build, install and launch the default app"
    deps: [install]
    cmds:
      - open "{{.NOTCH_DEST}}"
      - echo "✓ machNotch launched"

  run:soundscape:
    desc: "notch: build, install and launch the Soundscape app"
    deps: [install:soundscape]
    cmds:
      - open "{{.NOTCH_SOUNDSCAPE_DEST}}"
      - echo "✓ machNotch with Soundscape launched"

  kill:
    desc: "notch: stop the running default instance"
    cmds:
      - cmd: killall -9 machNotch
        ignore_error: true
      - cmd: pkill -f "{{.NOTCH_DEST}}/Contents/Resources/mediaremote-adapter.pl"
        ignore_error: true

  kill:soundscape:
    desc: "notch: stop the running Soundscape instance"
    cmds:
      - cmd: killall -9 machNotchWithSoundscape
        ignore_error: true
      - cmd: pkill -f "{{.NOTCH_SOUNDSCAPE_DEST}}/Contents/Resources/mediaremote-adapter.pl"
        ignore_error: true

  stop:
    desc: "Stop every mach app"
    cmds:
      - task: kill
      - task: kill:soundscape
      - task: brief:kill

  # ── mach.brief ────────────────────────────────────────────────────────────

  brief:build:
    desc: "brief: build the app and its widget"
    cmds:
      - >-
        xcodebuild -workspace "{{.WORKSPACE}}" -scheme machBrief
        -configuration {{.CONFIG}}
        -destination '{{.DEST}}' -derivedDataPath "{{.DD}}" build

  brief:install:
    desc: "brief: build, sign and install to ~/Applications"
    deps: [brief:build]
    cmds:
      - task: brief:kill
      - mkdir -p "{{.HOME}}/Applications"
      - rm -rf "{{.BRIEF_DEST}}"
      - cp -R "{{.PRODUCTS}}/{{.CONFIG}}/machBrief.app" "{{.BRIEF_DEST}}"
      - codesign --force --deep --sign "{{.CERT}}" "{{.BRIEF_DEST}}"
      - echo "✓ Installed and signed at {{.BRIEF_DEST}}"

  brief:run:
    desc: "brief: build, install and launch"
    deps: [brief:install]
    cmds:
      - open "{{.BRIEF_DEST}}"
      - echo "✓ machBrief launched"

  brief:kill:
    desc: "brief: stop the running instance"
    cmds:
      - cmd: killall -9 machBrief
        ignore_error: true

  # ── tests ─────────────────────────────────────────────────────────────────

  test:
    desc: "Run every test target"
    cmds:
      - >-
        xcodebuild -workspace "{{.WORKSPACE}}" -scheme mach-mono-Workspace
        -configuration Debug -destination '{{.DEST}}'
        -derivedDataPath "{{.DD}}" test

  test:one:
    desc: "Run one scheme's tests, e.g. task test:one SCHEME=NotchServices"
    cmds:
      - >-
        xcodebuild -workspace "{{.WORKSPACE}}" -scheme "{{.SCHEME}}"
        -configuration Debug -destination '{{.DEST}}'
        -derivedDataPath "{{.DD}}" test

  notch:test:
    desc: "notch: run machNotch tests"
    cmds: [task test:one SCHEME=machNotch]

  brief:test:
    desc: "brief: run MachBriefKit tests"
    cmds: [task test:one SCHEME=MachBriefKit]

  sound:test:
    desc: "sound: run MachSoundKit tests"
    cmds: [task test:one SCHEME=MachSoundKit]

  health:test:
    desc: "health: run HealthExportKit tests"
    cmds: [task test:one SCHEME=HealthExportKit]

  # ── release ───────────────────────────────────────────────────────────────

  archive:
    desc: "notch: Release build of the default app (unsigned unless IDENTITY is set)"
    cmds:
      - task: gen
      - >-
        xcodebuild -workspace "{{.WORKSPACE}}" -scheme machNotch
        -configuration Release -destination '{{.DEST}}'
        -derivedDataPath "{{.DD}}"
        MARKETING_VERSION="{{.VERSION}}"
        CURRENT_PROJECT_VERSION="{{.BUILD}}"
        build

  dmg:
    desc: "notch: build a Release DMG, e.g. task dmg VERSION=1.4.0"
    deps: [archive]
    cmds:
      - mkdir -p Release
      - chmod +x Apps/machNotch/Configuration/dmg/create_dmg.sh
      # dmgbuild goes in a throwaway environment. create_dmg.sh would otherwise
      # pip install into the Homebrew Python, which PEP 668 refuses.
      # uv resolves and installs this in about a second; falls back to venv+pip
      # so a machine without uv still works.
      - |
        VENV="$(mktemp -d)/venv"
        if command -v uv >/dev/null 2>&1; then
          uv venv --quiet "$VENV"
          uv pip install --quiet --python "$VENV/bin/python" "dmgbuild[badge_icons]"
        else
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet --upgrade pip setuptools wheel "dmgbuild[badge_icons]"
        fi
        PATH="$VENV/bin:$PATH" Apps/machNotch/Configuration/dmg/create_dmg.sh \
          "{{.PRODUCTS}}/Release/machNotch.app" \
          "Release/machNotch.dmg" \
          "machNotch {{.VERSION}}"
        rm -rf "$VENV"
      - echo "✓ Release/machNotch.dmg"

  # ── verification ──────────────────────────────────────────────────────────

  verify:no-soundscape:
    desc: "Assert the default app does not link MachSoundKit"
    deps: [build]
    cmds:
      - |
        APP="{{.PRODUCTS}}/{{.CONFIG}}/machNotch.app"
        test -d "$APP" || { echo "::error::missing $APP"; exit 1; }
        # Replaces the Bazel graph query. This inspects the shipped binary, so it
        # proves the artifact rather than the build graph.
        if nm -u "$APP/Contents/MacOS/machNotch" 2>/dev/null | grep -qi "MachSoundKit\|Soundscape"; then
          echo "::error::default machNotch links Soundscape/MachSoundKit"
          exit 1
        fi
        if otool -L "$APP/Contents/MacOS/machNotch" | grep -qi "AudioKit"; then
          echo "::error::default machNotch links AudioKit"
          exit 1
        fi
        echo "✓ default app is free of Soundscape, MachSoundKit and AudioKit"

  # ── lint ──────────────────────────────────────────────────────────────────

  lint:swift:
    desc: "lint: swift-format, the same scope CI checks"
    cmds:
      # Prefer a brewed swift-format (what CI installs); fall back to the one
      # bundled with the Xcode toolchain so a clean checkout still works.
      - |
        SF="$(command -v swift-format || xcrun --find swift-format)"
        "$SF" lint --strict --recursive --parallel \
          Apps/machNotch/machNotch/ Packages/MachBriefKit/Sources/ Packages/MacroVisionKit/Sources/

  lint:md:
    desc: "lint: check markdown files for style issues"
    cmds:
      - bunx markdownlint-cli "**/*.md" --ignore "node_modules" --ignore ".build" --ignore "external" --ignore "website/node_modules" --ignore "graphify-out"

  lint:md:fix:
    desc: "lint: fix markdown style issues automatically"
    cmds:
      - bunx markdownlint-cli "**/*.md" --fix --ignore "node_modules" --ignore ".build" --ignore "external" --ignore "website/node_modules" --ignore "graphify-out"

  arch:check:
    desc: "Run the architecture checks CI runs"
    cmds:
      - bash .github/scripts/arch-check.sh

  # ── plugin sdk ────────────────────────────────────────────────────────────

  sdk:example:
    desc: "sdk: build and test the example plugin against the public SDK"
    dir: examples/HelloPlugin
    cmds:
      # Plain SwiftPM on purpose. It is the only check that the SDK is usable
      # without Tuist, which is how a third-party author consumes it.
      - swift build
      - swift test

  # ── knowledge graph ───────────────────────────────────────────────────────

  graph:update:
    desc: "graph: re-extract the code graph into graphify-out/ (no LLM, no API cost)"
    cmds:
      - graphify update .

  graph:label:
    desc: "graph: re-name communities with an LLM (optional — hub names already exist)"
    cmds:
      # Communities are NOT unlabeled: graph:update gives each one the name of its
      # hub node, and ~80% of those are already project-meaningful. This task only
      # tries to improve the rest, and it relabels all of them, so it can make the
      # good ones worse. Not part of the normal refresh.
      #
      # graphify exits 0 and silently changes nothing when its backend is unusable,
      # so resolve a reachable backend here rather than report a no-op as success.
      - |
        if curl -sf --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
          graphify label . --backend=ollama --model="${OLLAMA_MODEL:-qwen3:4b}"
        elif [ -n "$GOOGLE_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
          graphify label . --backend=gemini
        elif [ -n "$ANTHROPIC_API_KEY" ]; then
          graphify label . --backend=claude
        else
          echo "No usable backend. Start ollama (free, local, no key) or set" >&2
          echo "GOOGLE_API_KEY / GEMINI_API_KEY / ANTHROPIC_API_KEY." >&2
          echo "The Claude Code CLI subscription does not satisfy the claude backend." >&2
          exit 1
        fi

  # ── skills ────────────────────────────────────────────────────────────────

  skills:sync:
    desc: "skills: mirror .claude/skills/ <-> .agents/skills/"
    cmds:
      - bun resources/tools/sync-skills.ts

  skills:check:
    desc: "skills: report drift between .claude/skills/ and .agents/skills/"
    cmds:
      - bun resources/tools/sync-skills.ts --dry-run
