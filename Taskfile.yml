version: "3"

vars:
  CERT: "Apple Development: ilars.boes@gmail.com (SVHPB8QYPH)"
  UNZIP_TMP: "/tmp/mach-install"

  NOTCH_DEST: "{{.HOME}}/Applications/machNotch.app"
  NOTCH_ZIP: "bazel-bin/Apps/machNotch/machNotch.zip"
  NOTCH_BIN: "{{.HOME}}/Applications/machNotch.app/Contents/MacOS/machNotch"
  NOTCH_SOUNDSCAPE_DEST: "{{.HOME}}/Applications/machNotchWithSoundscape.app"
  NOTCH_SOUNDSCAPE_ZIP: "bazel-bin/Apps/machNotch/machNotchWithSoundscape.zip"

  BRIEF_DEST: "{{.HOME}}/Applications/machBrief.app"
  BRIEF_ZIP: "bazel-bin/Apps/machBrief/machBrief.zip"

tasks:
  # ── mach.notch ────────────────────────────────────────────────────────────

  run:
    desc: "notch: build, install, launch full dev app with Soundscape"
    deps: [install:soundscape]
    cmds:
      - task: kill
      - task: kill:soundscape
      - sleep 1
      - open "{{.NOTCH_SOUNDSCAPE_DEST}}"
      - echo "✓ machNotch with Soundscape launched from {{.NOTCH_SOUNDSCAPE_DEST}}"

  build:
    desc: "notch: build full dev app with Soundscape"
    cmds:
      - bazelisk build //Apps/machNotch:machNotchWithSoundscape

  run:lite:
    desc: "notch: build, install, launch AudioKit-free app"
    deps: [install:lite]
    cmds:
      - task: kill
      - task: kill:soundscape
      - sleep 1
      - open "{{.NOTCH_DEST}}"
      - echo "✓ machNotch lite launched from {{.NOTCH_DEST}}"

  build:lite:
    desc: "notch: build AudioKit-free app with Bazel"
    cmds:
      - bazelisk build //Apps/machNotch:machNotch

  run:soundscape:
    desc: "notch: alias for task run"
    cmds:
      - task: run

  build:soundscape:
    desc: "notch: alias for task build"
    cmds:
      - task: build

  install:soundscape:
    desc: "notch: build and install Soundscape-enabled app to ~/Applications"
    deps: [build]
    vars:
      SENTINEL: "{{.HOME}}/Library/Caches/com.larsboes.mach/notch_soundscape_zip_hash"
    cmds:
      - |
        NEW_HASH="$(md5 "{{.NOTCH_SOUNDSCAPE_ZIP}}" | awk '{print $NF}')"
        OLD_HASH="$(cat "{{.SENTINEL}}" 2>/dev/null || echo "none")"
        if [ "$NEW_HASH" = "$OLD_HASH" ]; then
          echo "✓ Soundscape zip unchanged — skipping install (TCC permissions intact)"
        else
          echo "New Soundscape build detected — installing..."
          mkdir -p "{{.HOME}}/Applications"
          rm -rf "{{.NOTCH_SOUNDSCAPE_DEST}}" "{{.UNZIP_TMP}}"
          mkdir -p "{{.UNZIP_TMP}}"
          unzip -q "{{.NOTCH_SOUNDSCAPE_ZIP}}" -d "{{.UNZIP_TMP}}"
          mv "{{.UNZIP_TMP}}/machNotchWithSoundscape.app" "{{.NOTCH_SOUNDSCAPE_DEST}}"
          rm -rf "{{.UNZIP_TMP}}"
          codesign --force --deep --sign "{{.CERT}}" "{{.NOTCH_SOUNDSCAPE_DEST}}"
          mkdir -p "{{.HOME}}/Library/Caches/com.larsboes.mach"
          echo "$NEW_HASH" > "{{.SENTINEL}}"
          echo "✓ Installed and signed at {{.NOTCH_SOUNDSCAPE_DEST}}"
        fi

  install:
    desc: "notch: alias for full dev install with Soundscape"
    cmds:
      - task: install:soundscape

  install:lite:
    desc: "notch: build and install AudioKit-free app to ~/Applications"
    deps: [build:lite]
    vars:
      SENTINEL: "{{.HOME}}/Library/Caches/com.larsboes.mach/notch_zip_hash"
    cmds:
      - |
        NEW_HASH="$(md5 "{{.NOTCH_ZIP}}" | awk '{print $NF}')"
        OLD_HASH="$(cat "{{.SENTINEL}}" 2>/dev/null || echo "none")"
        if [ "$NEW_HASH" = "$OLD_HASH" ]; then
          echo "✓ Zip unchanged — skipping install (TCC permissions intact)"
        else
          echo "New build detected — installing..."
          mkdir -p "{{.HOME}}/Applications"
          rm -rf "{{.NOTCH_DEST}}" "{{.UNZIP_TMP}}"
          mkdir -p "{{.UNZIP_TMP}}"
          unzip -q "{{.NOTCH_ZIP}}" -d "{{.UNZIP_TMP}}"
          mv "{{.UNZIP_TMP}}/machNotch.app" "{{.NOTCH_DEST}}"
          rm -rf "{{.UNZIP_TMP}}"
          codesign --force --deep --sign "{{.CERT}}" "{{.NOTCH_DEST}}"
          mkdir -p "{{.HOME}}/Library/Caches/com.larsboes.mach"
          echo "$NEW_HASH" > "{{.SENTINEL}}"
          echo "✓ Installed and signed at {{.NOTCH_DEST}}"
        fi

  kill:
    desc: "notch: kill the running instance"
    cmds:
      - cmd: killall -9 machNotch
        ignore_error: true
      - cmd: pkill -f "{{.NOTCH_DEST}}/Contents/Resources/mediaremote-adapter.pl"
        ignore_error: true

  kill:soundscape:
    desc: "notch: kill the running Soundscape-enabled instance"
    cmds:
      - cmd: killall -9 machNotchWithSoundscape
        ignore_error: true
      - cmd: pkill -f "{{.NOTCH_SOUNDSCAPE_DEST}}/Contents/Resources/mediaremote-adapter.pl"
        ignore_error: true

  # ── mach.brief ────────────────────────────────────────────────────────────

  brief:run:
    desc: "brief: build, install (only if changed), launch"
    deps: [brief:install]
    cmds:
      - task: brief:kill
      - sleep 1
      - open "{{.BRIEF_DEST}}"
      - echo "✓ machBrief launched from {{.BRIEF_DEST}}"

  brief:build:
    desc: "brief: build with Bazel (dev signing via --config=local)"
    cmds:
      - bazelisk build //Apps/machBrief:machBrief

  brief:install:
    desc: "brief: build and install to ~/Applications"
    deps: [brief:build]
    cmds:
      - mkdir -p "{{.HOME}}/Applications"
      - rm -rf "{{.BRIEF_DEST}}" "{{.UNZIP_TMP}}"
      - mkdir -p "{{.UNZIP_TMP}}"
      - unzip -q "{{.BRIEF_ZIP}}" -d "{{.UNZIP_TMP}}"
      - mv "{{.UNZIP_TMP}}/machBrief.app" "{{.BRIEF_DEST}}"
      - rm -rf "{{.UNZIP_TMP}}"
      - echo "✓ Installed at {{.BRIEF_DEST}}"

  brief:kill:
    desc: "brief: kill the running instance"
    cmds:
      - cmd: killall -9 machBrief
        ignore_error: true

  brief:test:
    desc: "brief: run MachBriefKit tests"
    cmds:
      - bazelisk test //Packages/MachBriefKit:MachBriefKitTests

  # ── shared ────────────────────────────────────────────────────────────────

  notch:test:
    desc: "notch: run machNotch tests"
    cmds:
      - bazelisk test //Apps/machNotch:machNotchTests

  test:
    desc: "Run all tests"
    cmds:
      - bazelisk test //Apps/... //Packages/...

  sound:test:
    desc: "sound: run MachSoundKit tests"
    cmds:
      - bazelisk test //Packages/MachSoundKit:MachSoundKitTests

  health:test:
    desc: "health: run HealthExportKit tests"
    cmds:
      - bazelisk test //Packages/HealthExportKit:HealthExportKitTests

  lint:md:
    desc: "lint: check markdown files for style issues"
    cmds:
      - npx markdownlint-cli "**/*.md" --ignore "node_modules" --ignore ".build" --ignore "bazel-*" --ignore "external" --ignore "website/node_modules"

  lint:md:fix:
    desc: "lint: fix markdown style issues automatically"
    cmds:
      - npx markdownlint-cli "**/*.md" --fix --ignore "node_modules" --ignore ".build" --ignore "bazel-*" --ignore "external" --ignore "website/node_modules"

  # ── skills ────────────────────────────────────────────────────────────────

  skills:sync:
    desc: "skills: mirror .claude/skills/ → .gemini/skills/ and .cursor/skills/"
    cmds:
      - bash resources/tools/sync-skills.sh

  skills:check:
    desc: "skills: verify .gemini/skills/ and .cursor/skills/ match .claude/skills/"
    cmds:
      - bash resources/tools/sync-skills.sh --check
