# SwiftLint — supplementary to swift-format (the CI-enforced formatter).
# Only enable rules that catch logic/safety issues swift-format doesn't cover.

disabled_rules:
  - trailing_whitespace      # swift-format handles whitespace
  - todo                     # TODOs are tracked externally
  - identifier_name          # naming enforced by swift-format + review
  - line_length              # swift-format enforces 120

opt_in_rules:
  - empty_count
  - empty_string
  - legacy_random
  - legacy_cggeometry_functions
  - legacy_nsgeometry_functions

excluded:
  - Carthage
  - DerivedData
  - .build
  - .agent
  - .claude
  - bazel-*

# Active thresholds — these rules are NOT disabled, so thresholds apply.
file_length: 400
type_body_length: 400
function_body_length: 80
cyclomatic_complexity: 15

reporter: "xcode"
